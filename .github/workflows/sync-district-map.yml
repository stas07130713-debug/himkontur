name: Backup district map database

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: district-map-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and validate shared database
        env:
          GIST_URL: https://gist.githubusercontent.com/stas07130713-debug/4680bd012672437d695a7f691a59db5d/raw/district-map.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "${GIST_URL}?ts=$(date +%s)" --output /tmp/district-map.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/district-map.json', 'utf8'));
          if (data.id !== 'district-map-main') throw new Error('Unexpected district-map id.');
          if (!Array.isArray(data.draft) || !Array.isArray(data.published)) throw new Error('Invalid district-map arrays.');
          if (!Number.isSafeInteger(data.revision) || data.revision < 1) throw new Error('Invalid district-map revision.');
          fs.copyFileSync('/tmp/district-map.json', 'public/data/district-map.json');
          NODE

      - name: Commit a new database revision
        run: |
          if git diff --quiet -- public/data/district-map.json; then
            echo "The repository backup is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/district-map.json
          git commit -m "data: backup district map revision"
          git push origin HEAD:main
