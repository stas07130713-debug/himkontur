name: Backup district map database

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: district-map-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and validate shared database
        env:
          PRIMARY_MAP_API_URL: https://functions.yandexcloud.net/d4eqi6k1daj25oqpk6bp
          BACKUP_MAP_API_URL: https://himkontur-district-sync.stas07130713.workers.dev/v1/map
        run: |
          set -euo pipefail
          timestamp="$(date +%s)"
          if curl --fail --silent --show-error --location "${PRIMARY_MAP_API_URL}?ts=${timestamp}" --output /tmp/district-map-response.json; then
            echo "Downloaded the map from the primary Yandex database."
          else
            echo "The primary database is unavailable; downloading the current Cloudflare recovery copy."
            curl --fail --silent --show-error --location \
              --header "Origin: https://stas07130713-debug.github.io" \
              "${BACKUP_MAP_API_URL}?ts=${timestamp}" \
              --output /tmp/district-map-response.json
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/district-map-response.json', 'utf8'));
          const data = payload.project;
          if (data.id !== 'district-map-main') throw new Error('Unexpected district-map id.');
          if (!Array.isArray(data.draft) || !Array.isArray(data.published)) throw new Error('Invalid district-map arrays.');
          if (!Number.isSafeInteger(data.revision) || data.revision < 1) throw new Error('Invalid district-map revision.');
          const currentPath = 'public/data/district-map.json';
          const current = JSON.parse(fs.readFileSync(currentPath, 'utf8'));
          if (Number.isSafeInteger(current.revision) && data.revision < current.revision) {
            console.log(`Cloud revision ${data.revision} is older than repository revision ${current.revision}; keeping the newer recovery copy.`);
            process.exit(0);
          }
          fs.writeFileSync(currentPath, `${JSON.stringify(data, null, 2)}\n`);
          NODE

      - name: Commit a new database revision
        run: |
          if git diff --quiet -- public/data/district-map.json; then
            echo "The repository backup is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/district-map.json
          git commit -m "data: backup district map revision"
          git pull --rebase origin main
          git push origin HEAD:main
