name: Выпуск Windows и Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Получить исходные файлы
        uses: actions/checkout@v4
      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Проверить номер версии
        run: npm run release:check
      - name: Собрать установщик Windows
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run desktop:win -- --publish never
      - name: Сохранить файлы Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/windows/*.exe
            release/windows/*.blockmap
            release/windows/latest.yml

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходные файлы
        uses: actions/checkout@v4
      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Подготовить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Установить зависимости
        run: npm ci
      - name: Проверить номер версии
        run: npm run release:check
      - name: Проверить ключ подписи Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Не задан секрет ANDROID_KEYSTORE_BASE64" && exit 1)
      - name: Подготовить подписной ключ Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
      - name: Подготовить Android-проект
        run: npm run android:sync
      - name: Собрать подписанный APK
        working-directory: android
        env:
          HIMKONTUR_KEYSTORE: release.keystore
          HIMKONTUR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HIMKONTUR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HIMKONTUR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Подготовить имя APK
        run: cp android/app/build/outputs/apk/release/app-release.apk HIMKONTUR-Android.apk
      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: HIMKONTUR-Android.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Получить собранные приложения
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Опубликовать выпуск
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
